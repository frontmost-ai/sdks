[project]
name = "frontmost"
version = "0.2.0"
description = "See when ChatGPT and other AI apps recommend your business, from your own code and agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["frontmost", "ai visibility", "aeo", "geo", "chatgpt", "ai search", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1", "typing-extensions>=4.7"]

[project.urls]
Homepage = "https://frontmost.ai"
Documentation = "https://github.com/frontmost-ai/sdks/tree/main/python#readme"
Repository = "https://github.com/frontmost-ai/sdks"
Issues = "https://github.com/frontmost-ai/sdks/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontmost"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# One-line exception classes read best as one line.
ignore = ["E701"]
